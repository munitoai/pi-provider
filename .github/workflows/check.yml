name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: package.json and models.json parse
        run: node -e 'for (const f of ["package.json", "models.json"]) JSON.parse(require("fs").readFileSync(f, "utf8"))'
